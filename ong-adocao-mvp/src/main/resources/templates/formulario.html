<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pré-Triagem de Adoção</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold">Adote Cão & Gato</span>
        </div>
    </nav>

    <main class="container my-4" style="max-width: 600px;">
        <div class="text-center mb-3">
            <h1 class="h4 fw-bold" th:text="|Quero Adotar: ${animal.nome}|">Quero Adotar</h1>
            <p class="text-muted small" th:text="${animal.descricao}">Descrição do animal</p>
            <img th:src="${animal.imagemUrl}" class="rounded-circle shadow-sm mb-3"
                 th:alt="${animal.nome}"
                 style="width: 100px; height: 100px; object-fit: cover;">
        </div>

        <div class="card shadow-sm border-0 p-4">
            <form th:action="@{/adotar/{id}/candidaturas(id=${animal.id})}"
                  th:object="${candidatura}" method="POST">
                <h5 class="fw-bold mb-3 text-secondary">Dados Pessoais</h5>
                
                <div class="mb-3">
                    <label for="nome" class="form-label fw-semibold">Nome Completo</label>
                    <input type="text" class="form-control py-2" id="nome" th:field="*{nome}" required
                           maxlength="120" placeholder="Digite seu nome completo">
                    <div class="text-danger small" th:if="${#fields.hasErrors('nome')}"
                         th:errors="*{nome}"></div>
                </div>

                <div class="mb-3">
                    <label for="telefone" class="form-label fw-semibold">Telefone / WhatsApp</label>
                    <input type="tel" class="form-control py-2" id="telefone" th:field="*{telefone}"
                           required maxlength="30" placeholder="(83) 99999-8888">
                    <div class="text-danger small" th:if="${#fields.hasErrors('telefone')}"
                         th:errors="*{telefone}"></div>
                </div>

                <div class="mb-3">
                    <label for="bairro" class="form-label fw-semibold">Bairro e Cidade</label>
                    <input type="text" class="form-control py-2" id="bairro" th:field="*{bairro}"
                           required maxlength="160" placeholder="Ex: Tambaú, João Pessoa">
                    <div class="text-danger small" th:if="${#fields.hasErrors('bairro')}"
                         th:errors="*{bairro}"></div>
                </div>

                <h5 class="fw-bold mt-4 mb-3 text-secondary">Perfil de Adoção</h5>

                <div class="mb-3">
                    <label for="moradia" class="form-label fw-semibold">Tipo de Moradia</label>
                    <select class="form-select py-2" id="moradia" th:field="*{moradia}" required>
                        <option value="" disabled selected>Selecione o tipo</option>
                        <option value="casa">Casa</option>
                        <option value="apartamento">Apartamento</option>
                    </select>
                    <div class="text-danger small" th:if="${#fields.hasErrors('moradia')}"
                         th:errors="*{moradia}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold d-block">Possui telas de proteção ou muro?</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" th:field="*{telas}"
                               id="telasSim" value="sim" required>
                        <label class="form-check-label" for="telasSim">Sim</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" th:field="*{telas}"
                               id="telasNao" value="nao">
                        <label class="form-check-label" for="telasNao">Não</label>
                    </div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('telas')}"
                         th:errors="*{telas}"></div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-semibold d-block">Possui outros animais em casa?</label>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" th:field="*{outrosAnimais}"
                               id="animaisSim" value="sim" required>
                        <label class="form-check-label" for="animaisSim">Sim</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" th:field="*{outrosAnimais}"
                               id="animaisNao" value="nao">
                        <label class="form-check-label" for="animaisNao">Não</label>
                    </div>
                    <div class="text-danger small" th:if="${#fields.hasErrors('outrosAnimais')}"
                         th:errors="*{outrosAnimais}"></div>
                </div>

                <button type="submit" class="btn btn-success w-100 py-3 fw-bold mb-2">Enviar Candidatura</button>
                <a href="/vitrine" class="btn btn-outline-secondary w-100 py-2">Voltar</a>
            </form>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
