<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adote Cão & Gato - Vitrine Pública</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/custom.css}">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1 fw-bold">Adote Cão & Gato</span>
            <button class="navbar-toggler" type="button" aria-label="Menu">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <main class="container my-4">
        <div class="text-center mb-4">
            <h1 class="h3 fw-bold text-dark">Animais Disponíveis</h1>
            <p class="text-muted">Encontre seu novo melhor amigo</p>
        </div>

        <div class="d-flex justify-content-center gap-2 mb-4 flex-wrap">
            <a href="/vitrine?especie=cao" class="btn btn-primary px-4 py-2"
               th:classappend="${especieSelecionada == 'cao'} ? 'active'">Filtrar Cães</a>
            <a href="/vitrine?especie=gato" class="btn btn-secondary px-4 py-2"
               th:classappend="${especieSelecionada == 'gato'} ? 'active'">Filtrar Gatos</a>
            <a href="/vitrine" class="btn btn-success px-4 py-2"
               th:classappend="${especieSelecionada == null} ? 'active'">Todos</a>
        </div>

        <div class="row g-3">
            <div class="col-12 col-md-6 col-lg-4" th:each="animal : ${animais}">
                <div class="card h-100 shadow-sm border-0">
                    <img th:src="${animal.imagemUrl}" class="card-img-top"
                         th:alt="|Foto de ${animal.nome}|"
                         style="height: 220px; object-fit: cover;">
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title fw-bold text-center" th:text="${animal.nome}">Animal</h5>
                        <p class="card-text text-muted text-center small mb-3"
                           th:text="${animal.descricao}">Descrição do animal</p>
                        <a th:href="@{/adotar/{id}(id=${animal.id})}"
                           class="btn btn-success mt-auto py-2 fw-semibold">Quero Adotar</a>
                    </div>
                </div>
            </div>
        </div>

        <p class="text-center text-muted mt-4" th:if="${#lists.isEmpty(animais)}">
            Nenhum animal encontrado para esse filtro.
        </p>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
